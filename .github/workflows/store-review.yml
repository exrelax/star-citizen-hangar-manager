# Moves the store issues (label `store-review`) on the project board from "In review" to "Done"
# once their store has published the version, comments the version seen and closes them (#350).
# Then closes a publish issue ("Publish v1.1.1") once all its sub-issues are closed, and its
# milestone once all of its issues are (#365). Starts a website build when it closed one, or when the
# roadmap shows a version's review state wrongly: a change on the board starts no workflow (#354).
# See scripts/store-review/store-review.ts. Runs hourly and by hand ("Run workflow"; "dry run"
# only reports).
#
# The board of a user can't be changed with the workflow's own token, so it needs the secret
# PROJECT_TOKEN: a fine-grained token of the board's owner with read and write access to
# projects. Without it the run only reports what it would do.
name: Store review

on:
  # An issue closed by hand (a store issue, a publish issue): its publish issue and milestone may
  # close now (#365). What this workflow closes itself starts no workflow.
  issues:
    types: [closed]
  schedule:
    # A few minutes past the hour: the full hour is GitHub's busiest time for scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report, change nothing
        type: boolean
        default: false

# Comments on and closes the issues and starts a website build when the roadmap is outdated
# (#354); the board is changed with PROJECT_TOKEN.
permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: store-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Node runs the TypeScript files as they are; nothing to install. setup-node would cache
      # pnpm's store on its own (`packageManager` in package.json), but pnpm isn't set up here.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check the stores
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node scripts/store-review/store-review.ts $DRY_RUN
