# Pushing a tag like `v1.0.0` builds the store zips and creates a draft GitHub release with them.
# The release stays a draft until it is published by hand on GitHub. See "Releasing" in
# docs/DEVELOPMENT.md.
name: Release

on:
  push:
    tags: ['v*']

# Writes the release; nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The version is set only in package.json; the tag has to match it.
      - name: Check the tag against package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Fails before building if CHANGELOG.md has no section for the version.
      - name: Read the release notes from CHANGELOG.md
        run: node scripts/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test

      # The Chrome and Firefox zips and the sources zip for addons.mozilla.org, in .output.
      - run: pnpm zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" .output/*.zip
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
