# Builds the project website (`site/`, see site/vite.config.ts) and deploys it to GitHub Pages.
# Runs on pushes to main that change the site, the images it shows or PRIVACY.md (its privacy
# page), when issues or milestones change (the roadmap is built from them), when a release is
# published (the current version), daily (for changes of the project board, which trigger no
# event here, and for the ships' data of the Ship Matrix and the Star Citizen Wiki, #107) and by hand
# ("Run workflow"). In the repository settings, Pages → "Build and
# deployment" → Source has to be set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store/**'
      - 'public/icon/**'
      - 'src/assets/logo/**'
      - 'PRIVACY.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - deleted
      - transferred
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  milestone:
    types: [created, edited, opened, closed, deleted]
  # A new version shows at once (hero and roadmap), not only with the next daily build. A release
  # runs on its tag, which the `github-pages` environment doesn't let deploy (only `main` may), so
  # this run only starts another one on `main` (the job `on-release`).
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Reads the code and the issues (roadmap), commits the ships' history (branch data/ships, #107),
# deploys to Pages with an OIDC token and, for a release, starts this workflow on main; nothing
# else.
permissions:
  actions: write
  contents: write
  issues: read
  pages: write
  id-token: write

# One deployment at a time; a running one is finished, not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A published release: build and deploy from main instead of from the tag.
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh workflow run site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The ships' history (#107) lives on the branch `data/ships` (its only file: ships.json), not
      # on main: main is protected and takes changes only through pull requests, so a run can't
      # commit there. Each run continues the history of that branch; without the branch (the first
      # run), it continues the file of main, which the extension bundles as its fallback.
      - name: Read the ships' history
        id: history
        # `ls-remote` exits with 2 only if the branch is missing; any other error fails the run, so
        # a history that can't be read is never started anew from main.
        run: |
          found=0
          git ls-remote --exit-code --heads origin data/ships > /dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/data/ships
            git show FETCH_HEAD:ships.json > site/public/data/ships.json
            echo "parent=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$found" -eq 2 ]; then
            echo 'No branch data/ships yet: continuing the file of main.'
          else
            exit "$found"
          fi

      # The ships with their status, "always available" and standard price, and their history
      # (#107): from RSI's Ship Matrix and the Star Citizen Wiki into site/public/data/ships.json,
      # continuing the history read above. If a source fails or looks broken, this step fails,
      # nothing is deployed and the last deployment stays.
      - id: ships
        run: pnpm site:ships

      # A change (a new ship, a status, availability or price that changed) is committed to the
      # branch `data/ships`, on top of its last commit, without checking it out. Pushes with this
      # token start no new run.
      - name: Commit the ships' history
        if: steps.ships.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          PARENT: ${{ steps.history.outputs.parent }}
        run: |
          blob=$(git hash-object -w site/public/data/ships.json)
          tree=$(printf '100644 blob %s\tships.json\n' "$blob" | git mktree)
          commit=$(
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" ${PARENT:+-p "$PARENT"} \
              -m "chore(site): Update the ships (revision ${{ steps.ships.outputs.revision }})"
          )
          git push origin "$commit:refs/heads/data/ships"

      # The roadmap reads the issues with this token. The columns of the project board need a token
      # that can read the project: the optional secret ROADMAP_TOKEN (a fine-grained token with
      # read access to projects). Without access, the roadmap lists open issues by number and the
      # run shows a warning. If GitHub's API fails, the build fails and the last deployment stays.
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
