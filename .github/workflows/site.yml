# Builds the project website (`site/`, see site/vite.config.ts) and deploys it to GitHub Pages.
# Runs on pushes to main that change the site, the images it shows or PRIVACY.md (its privacy
# page), when issues or milestones change (the roadmap is built from them), when a release is
# published (the current version), daily (for changes of the project board, which trigger no
# event here, and for the ships' data of the Ship Matrix and the Star Citizen Wiki, #107) and by hand
# ("Run workflow"). In the repository settings, Pages → "Build and
# deployment" → Source has to be set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store/**'
      - 'public/icon/**'
      - 'src/assets/logo/**'
      - 'PRIVACY.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - deleted
      - transferred
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  milestone:
    types: [created, edited, opened, closed, deleted]
  # A new version shows at once (hero and roadmap), not only with the next daily build.
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Reads the code and the issues (roadmap), commits the ships' history (data/ships.json, #107) and
# deploys to Pages with an OIDC token; nothing else.
permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

# One deployment at a time; a running one is finished, not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The ships with their status, "always available" and standard price, and their history
      # (#107): from RSI's Ship Matrix and the Star Citizen Wiki into site/public/data/ships.json,
      # continuing the committed file. If a source fails or looks broken, this step fails, nothing
      # is deployed and the last deployment stays.
      - id: ships
        run: pnpm site:ships

      # A change (a new ship, a status, availability or price that changed) is committed to main,
      # so the history lives in the repository. Pushes with this token start no new run.
      - name: Commit the ships' history
        if: steps.ships.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public/data/ships.json
          git commit -m "chore(site): Update the ships (revision ${{ steps.ships.outputs.revision }})"
          git pull --rebase origin main
          git push origin HEAD:main

      # The roadmap reads the issues with this token. The columns of the project board need a token
      # that can read the project: the optional secret ROADMAP_TOKEN (a fine-grained token with
      # read access to projects). Without access, the roadmap groups into open and done and the
      # run shows a warning. If GitHub's API fails, the build fails and the last deployment stays.
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
