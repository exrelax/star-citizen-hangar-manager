# Builds the project website (`site/`, see site/vite.config.ts) and deploys it to GitHub Pages.
# Runs on pushes to main that change the site, the images it shows or PRIVACY.md (its privacy
# page), when issues or milestones change (the roadmap is built from them), daily (for changes of
# the project board, which trigger no event here) and by hand ("Run workflow"). In the repository
# settings, Pages → "Build and deployment" → Source has to be set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store/**'
      - 'public/icon/**'
      - 'src/assets/logo/**'
      - 'PRIVACY.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - deleted
      - transferred
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  milestone:
    types: [created, edited, opened, closed, deleted]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Reads the code and the issues (roadmap), and deploys to Pages with an OIDC token; nothing else.
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

# One deployment at a time; a running one is finished, not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The roadmap reads the issues with this token. The columns of the project board need a token
      # that can read the project: the optional secret ROADMAP_TOKEN (a fine-grained token with
      # read access to projects). Without access, the roadmap groups into open and done and the
      # run shows a warning. If GitHub's API fails, the build fails and the last deployment stays.
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
