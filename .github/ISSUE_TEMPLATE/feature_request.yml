name: Feature request
description: Suggest an idea or an improvement.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please check the [existing issues](https://github.com/exrelax/star-citizen-hangar-manager/issues) and the [list of features](https://github.com/exrelax/star-citizen-hangar-manager/blob/main/docs/FEATURES.md) first.

        You don't need to write any code: describe the problem, and we'll discuss the solution here before anyone starts building it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - My Hangar (list, filters, search)
        - Buy Back
        - Exchange or gift dialogs
        - Orders and refunds
        - Settings
        - Themes and layout
        - Translations
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I …, I have to …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Describe the solution you have in mind. Sketches or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you thought of.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this idea isn't suggested yet.
          required: true
        - label: The idea keeps user data in the browser (see the [principles](https://github.com/exrelax/star-citizen-hangar-manager/blob/main/CONTRIBUTING.md#principles)).
          required: false
